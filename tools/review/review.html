<title>패션몰 데이터 확인</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 한 줄 카드 목록: 항목마다 노트 값 / 사이트 값을 알약 버튼으로 골라 저장 */
:root{
  --bg:#faf6f6; --card:#ffffff; --fg:#3a2e31; --muted:#8a7a7e; --line:#ecdfe1;
  --rose:#b0707d; --rose-soft:#f3e4e6; --ok:#5d8a6a; --ok-soft:#e5f0e8; --warn:#b5883e; --warn-soft:#f6eddc;
  --display:"Gowun Dodum","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1a1c; --card:#2a2326; --fg:#efe4e6; --muted:#a8979b; --line:#3d3337;
  --rose:#d898a5; --rose-soft:#43323a; --ok:#8fc19e; --ok-soft:#2b3a30; --warn:#e0b672; --warn-soft:#3d3426; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1a1c; --card:#2a2326; --fg:#efe4e6; --muted:#a8979b; --line:#3d3337;
  --rose:#d898a5; --rose-soft:#43323a; --ok:#8fc19e; --ok-soft:#2b3a30; --warn:#e0b672; --warn-soft:#3d3426; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
h2{font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:6px 0 0}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.meter{flex:1;min-width:140px;height:8px;background:var(--rose-soft);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--rose);width:0;transition:width .3s}
.count{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.seg{display:inline-flex;background:var(--rose-soft);border-radius:99px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-size:13px;padding:4px 12px;border-radius:99px;color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.list{display:grid;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.item.done{border-color:transparent;background:color-mix(in srgb,var(--card) 70%,var(--bg))}
.head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.name{font-weight:600}
.id{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.field{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--rose-soft);color:var(--rose)}
.hint{font-size:12.5px;color:var(--muted)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 12px;cursor:pointer;text-align:left;min-height:34px}
.opt small{color:var(--muted);font-size:11.5px;margin-right:4px}
.opt[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-soft)}
.opt[aria-pressed="true"][data-v="site"]{border-color:var(--ok);background:var(--ok-soft)}
.opt[aria-pressed="true"][data-v="check"]{border-color:var(--warn);background:var(--warn-soft)}
.opt:focus-visible,.seg button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.state{font-size:12px;color:var(--muted)}
.notice{font-size:13px;background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:10px 12px}
footer{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>새 노트 데이터 확인</h1>
    <p class="sub">기존 노트와 공략 사이트 값이 다른 곳이에요. 탭하면 바로 저장돼요. 안 고른 항목은 노트 값을 그대로 써요.</p>
  </header>

  <div class="bar">
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <span class="count" id="count">0 / 0</span>
    <div class="seg" role="group" aria-label="보기">
      <button id="f-all" aria-pressed="true">전체</button>
      <button id="f-todo" aria-pressed="false">남은 것</button>
    </div>
  </div>
  <p class="notice" id="notice" hidden></p>

  <h2>옷 매칭 · 같은 옷인지 골라 주세요</h2>
  <div class="list" id="match"></div>

  <h2>옷 정보가 다른 칸</h2>
  <div class="list" id="diff"></div>

  <footer>출처: 기존 노트(2026-11-06 백업), KairoHistory 공략 사이트(비공식 팬 위키). 개인 참고용, 카이로소프트 공식 아님.</footer>
</div>

<script>
const MATCH = [
  {key:"clo:140", id:140, name:"코튼 팬츠", hint:"노트: US레트로 · 팬츠 · 센터프레스 · 갈색 · 봄·가을",
   opts:[{v:"136",label:"#136 코튼 팬츠",d:"팬츠+센터 프레스 · 갈 · 품질 34 · ¥1,420"},{v:"144",label:"#144 코튼 팬츠",d:"팬츠+센터 프레스+벨트 · 파란 · 품질 54 · ¥1,690"},{v:"none",label:"둘 다 아님",d:""}]},
  {key:"clo:426", id:426, name:"카이로군 변신 슈트", hint:"노트: 사이버 · 아직 못 만든 옷",
   opts:[{v:"218",label:"#218 카이로군 변장 슈트",d:"셋업 · 코스프레 · 셋업+스트레이트+찐빵"},{v:"none",label:"다른 옷",d:""},{v:"check",label:"게임에서 확인할게",d:""}]},
  {key:"clo:427", id:427, name:"카이로군 변신 헤드", hint:"노트: 사이버 · 아직 못 만든 옷",
   opts:[{v:"459",label:"#459 카이로군 변장 헤드",d:"액세서리 · 코스프레 · 노란"},{v:"none",label:"다른 옷",d:""},{v:"check",label:"게임에서 확인할게",d:""}]},
];
const DIFF = [
  [15,"롤업 데님","색","파랑·흰색","파란"],[17,"리브 니트 플레어 팬츠","색","보라·흰색","보라"],
  [18,"스트레치 스키니 팬츠","색","검정·흰색","검은"],[19,"타이트 라인 팬츠","색","초록·흰색","초록"],
  [25,"세미 타이트 롱스커트","색","주황·초록","주황"],[33,"오픈 백 티셔츠","옵션","(없음)","프린트"],
  [42,"유니폼 스타일 탱크톱","옵션","(없음)","프린트"],[42,"유니폼 스타일 탱크톱","색","파랑·빨강","주황"],
  [42,"유니폼 스타일 탱크톱","계절","봄·가을","여름"],[83,"프릴 플레어스커트","색","갈색·갈색","갈"],
  [122,"전통 개량 의상","옷본","기모노","전통 의상"],[123,"전통 의상","옷본","기모노","전통 의상"],
  [160,"언밸런스 보더 티셔츠","옵션","프린트","보더"],[199,"미니 메이드복","옷본","스커트","원피스"],
  [199,"미니 메이드복","재료","플레어","A라인"],[212,"닌자복","옷본","기모노","전통 의상"],
  [213,"일본 스타일 로리타 원피스","옷본","기모노","전통 의상"],[214,"검도복","옷본","기모노","전통 의상"],
  [340,"라메 레이스 원피스","색","주황","보라"],[343,"아가일 패턴 니트","계절","여름","겨울"],
].map(([id,name,field,note,site])=>({key:`${id}:${field}`,id,name,field,
  opts:[{v:"note",label:note,d:"노트"},{v:"site",label:site,d:"사이트"},{v:"check",label:"게임에서 확인할게",d:""}]}));

// 저장소 문서 id는 영문·숫자·_-.~:@+ 만 된다. 한국어 항목명은 영문 코드로 바꾼다(data.key에는 원래 키를 그대로 둔다).
const FIELD_ID = {"색":"col","옵션":"opt","계절":"season","옷본":"pat","재료":"mat"};
const docId = key => key.replace(/[^:]+$/, f => FIELD_ID[f] ?? f).replace(/[/:]/g, "_");

const choices = {};           // key -> {choice}
let db = null, filter = "all";

function render(){
  for (const [el, items, field] of [[match, MATCH, false],[diff, DIFF, true]]){
    el.replaceChildren(...items.filter(it => filter==="all" || !choices[it.key]).map(it => {
      const box = document.createElement("div");
      box.className = "item" + (choices[it.key] ? " done" : "");
      const head = document.createElement("div"); head.className = "head";
      head.innerHTML = `<span class="id">${it.id}</span><span class="name"></span>` + (field ? `<span class="field"></span>` : "");
      head.querySelector(".name").textContent = it.name;
      if (field) head.querySelector(".field").textContent = it.field;
      box.append(head);
      if (it.hint){ const h = document.createElement("div"); h.className="hint"; h.textContent = it.hint; box.append(h); }
      const opts = document.createElement("div"); opts.className = "opts";
      for (const o of it.opts){
        const b = document.createElement("button");
        b.className = "opt"; b.dataset.v = o.v; b.type = "button";
        b.setAttribute("aria-pressed", String(choices[it.key]?.choice === o.v));
        if (o.d){ const s = document.createElement("small"); s.textContent = o.d; b.append(s); }
        b.append(document.createTextNode(o.label));
        b.onclick = () => pick(it.key, o.v);
        opts.append(b);
      }
      box.append(opts);
      return box;
    }));
  }
  const total = MATCH.length + DIFF.length;
  const done = [...MATCH, ...DIFF].filter(it => choices[it.key]).length;
  count.textContent = `${done} / ${total}`;
  meter.style.width = (100 * done / total) + "%";
}

async function pick(key, v){
  const prev = choices[key];
  if (prev?.choice === v){ delete choices[key]; } else { choices[key] = {choice: v}; }
  render();
  if (!db){ return; }
  try {
    const ref = db.doc("choices/" + docId(key));
    if (choices[key]) await ref.set({key, choice: v, t: Date.now()});
    else await ref.delete();
  } catch (e) {
    if (prev) choices[key] = prev; else delete choices[key];
    render();
    const code = e?.code ?? (e instanceof TypeError ? "bad_id" : "unknown");
    const msg = code === "unavailable" ? "연결이 잠시 불안정해요. 조금 뒤 다시 눌러 주세요."
      : code === "revoked" || code === "not_granted" ? "저장 권한이 없어요. 페이지를 새로 열어 주세요."
      : `저장하지 못했어요 (${code}).`;
    showNotice(msg);
  }
}

function showNotice(t){ notice.textContent = t; notice.hidden = false; }

for (const [id, f] of [["f-all","all"],["f-todo","todo"]]){
  document.getElementById(id).onclick = () => {
    filter = f;
    document.getElementById("f-all").setAttribute("aria-pressed", String(f==="all"));
    document.getElementById("f-todo").setAttribute("aria-pressed", String(f==="todo"));
    render();
  };
}

render();

(async () => {
  const timer = setTimeout(() => { if (!db) showNotice("저장소에 연결되지 않았어요. 고른 값이 저장되지 않을 수 있어요."); }, 10000);
  db = await window.claude?.use?.("db") ?? null;
  if (!db){ clearTimeout(timer); showNotice("저장소에 연결되지 않았어요. 로그인한 상태로 열어 주세요."); return; }
  db.collection("choices").onSnapshot(snap => {
    clearTimeout(timer);
    for (const k of Object.keys(choices)) delete choices[k];
    for (const d of snap.docs){ const x = d.data(); if (x?.key) choices[x.key] = {choice: x.choice}; }
    render();
  }, () => { clearTimeout(timer); showNotice("저장된 선택을 불러오지 못했어요."); });
})();
</script>
