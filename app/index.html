<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}.nmrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.nmrow:first-child{border-top:0}
.nm-n{flex:1;min-width:0;font-size:14px;font-weight:600}
.nm-n .desc{display:block;font-weight:400}
.nm-t{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:45%}
.nmlist{margin-top:8px}
.linkhead{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
/* 옷 상세: 사이트 기준값 */
.csite{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.cs-facts{display:flex;flex-wrap:wrap;gap:6px 14px}
.cs-f small,.cs-line>small{color:var(--fg3);font-size:11.5px;margin-right:4px}
.cs-f b{font-size:15px}
.cs-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px;font-size:13px}
.cs-line>small{flex-basis:100%}
.cs-v{margin:0 6px 0 2px;font-size:12.5px}
.csite .hint{margin-top:6px}
.csite .linkbtn{margin-top:8px}
.btsite{margin:10px 0}
.bt-ok{color:var(--green);font-size:12px}
.bt-ng{color:var(--red);font-size:12px}
.s.cs-site{color:var(--fg);font-weight:600}
/* 마네킹 플래너 */
.mqcard .fc-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mq-chips{margin-top:8px}
.mq-saved{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--card)}
.mq-pcs{display:flex;flex-wrap:wrap;gap:4px 10px}
.mq-pc{font-size:13.5px;font-weight:600}
.mq-pc small{color:var(--fg3);font-weight:400;margin-right:4px;font-size:11.5px}
.mq-pc.dim{opacity:.4}
.mq-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag.mq-ok{color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.tag.mq-ng{color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.tag.mq-pct{font-weight:700}
.mq-warn{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--red)}
.mq-warn svg{width:16px;height:16px;flex:none}
.mq-act{display:flex;gap:6px;margin-top:10px}
.mq-list{margin-top:10px}
.mq-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.mq-row:first-child{border-top:0}
.mq-row.on .mq-body{opacity:.6}
.mq-rk{width:18px;flex:none;color:var(--fg3);font-weight:700;text-align:center}
.mq-body{flex:1;min-width:0}
.mq-row .btn{flex:none;white-space:nowrap}
</style>
</head>
<body>
<title>패션몰스토리 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* layout: 한 열 모바일 앱 셸, 상단 요약 카드 → 탭별 리스트, 하단 고정 탭바 */
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --fg:#191F28; --fg2:#4E5968; --fg3:#8B95A1; --line:#E5E8EB;
  --soft:#F2F4F6; --blue:#3182F6; --blue-soft:#E8F3FF; --blue-ink:#1B64DA;
  --green:#03B26C; --green-soft:#E5F8EF; --red:#F04452; --amber-soft:#FFF4E0; --amber-ink:#B86E00;
  --press:rgba(2,32,71,.05); --sheet:rgba(0,0,0,.35);
  --font:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --r-lg:22px; --r-md:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101013; --card:#1C1C21; --fg:#F2F3F5; --fg2:#C3C7CF; --fg3:#7E8590; --line:#2C2D33;
  --soft:#26272D; --blue:#4D94FF; --blue-soft:#18273D; --blue-ink:#8AB8FF;
  --green:#2DCB8A; --green-soft:#12291F; --red:#FF6170; --amber-soft:#2E2414; --amber-ink:#F2B45B;
  --press:rgba(255,255,255,.05); --sheet:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101013; --card:#1C1C21; --fg:#F2F3F5; --fg2:#C3C7CF; --fg3:#7E8590; --line:#2C2D33;
  --soft:#26272D; --blue:#4D94FF; --blue-soft:#18273D; --blue-ink:#8AB8FF;
  --green:#2DCB8A; --green-soft:#12291F; --red:#FF6170; --amber-soft:#2E2414; --amber-ink:#F2B45B;
  --press:rgba(255,255,255,.05); --sheet:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-top:20px}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 4px 4px}
.hello h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.hello p{margin:2px 0 0;color:var(--fg3);font-size:13px}
.sync{font-size:12px;color:var(--fg3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--fg3)}
.sync.on i{background:var(--green)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:var(--r-lg);padding:20px}
.stat{display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .12s}
.stat:active{transform:scale(.98)}
.stat .k{font-size:13px;color:var(--fg2);font-weight:500}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:14px;color:var(--fg3);font-weight:500;margin-left:4px}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .4s}
.stat.on{box-shadow:inset 0 0 0 2px var(--blue)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.sec-h h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.sec-h span{font-size:13px;color:var(--fg3);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--soft);color:var(--fg2);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip b{font-weight:500;color:var(--fg3);font-size:12px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--fg);color:var(--card)}
.chip.on b{color:var(--card);opacity:.7}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{height:32px;padding:0 12px;border-radius:9px;font-size:13px;color:var(--fg2);font-weight:500}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search{flex:1;min-width:150px;height:38px;border-radius:12px;background:var(--soft);border:0;padding:0 14px;font-size:14px}
.search::placeholder{color:var(--fg3)}
.list{display:flex;flex-direction:column;margin:8px -20px 0}
.row{display:flex;align-items:center;gap:14px;padding:12px 20px;min-height:64px;text-align:left;width:100%;transition:background .12s}
.row:hover,.row:active{background:var(--press)}
.row .body{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .s{font-size:13px;color:var(--fg3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .t span.n{color:var(--fg3)}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:all .15s}
.ck svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:all .15s}
.ck.on{background:var(--blue);border-color:var(--blue)}
.ck.on svg{opacity:1;transform:none}
.tag{font-size:11px;font-weight:500;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--fg2);display:inline-flex;align-items:center;gap:4px}
.tag .dot{width:6px;height:6px;border-radius:50%}
.tag.blue{background:var(--blue-soft);color:var(--blue-ink)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.red{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.tag.amber{background:var(--amber-soft);color:var(--amber-ink)}
.chev{flex:none;color:var(--fg3);transition:transform .2s}
.open .chev{transform:rotate(90deg)}
.detail{padding:4px 20px 18px 60px;display:flex;flex-direction:column;gap:12px}
.detail h4{margin:0 0 6px;font-size:12px;color:var(--fg3);font-weight:500}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;padding:5px 10px;border-radius:10px;background:var(--soft);color:var(--fg2)}
.pill.must{background:var(--blue-soft);color:var(--blue-ink);font-weight:500}
.pill.need{background:var(--blue);color:#fff;font-weight:500}
.pill b{font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}
.rename{display:flex;gap:8px}
.rename input{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px}
.btn{height:40px;padding:0 16px;border-radius:12px;background:var(--blue);color:#fff;font-weight:500;font-size:14px;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--fg2)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.empty{padding:36px 20px;text-align:center;color:var(--fg3);font-size:14px}
.need-card .pills{margin-top:2px}
.more{display:block;width:calc(100% + 40px);margin:4px -20px -20px;padding:16px;border-top:1px solid var(--line);color:var(--fg2);font-size:14px;font-weight:500;border-radius:0 0 var(--r-lg) var(--r-lg)}
.more:hover{background:var(--press)}
.coord{padding:14px 20px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.coord:first-child{border-top:0}
.coord .who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.coord .req{color:var(--fg2);font-size:14px}
.coord .note{font-size:12px;color:var(--amber-ink);background:var(--amber-soft);padding:6px 10px;border-radius:10px;align-self:flex-start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--fg3)} .kv dd{margin:0;color:var(--fg2);min-width:0}
.tbl-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table.up{border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums;min-width:720px}
table.up th,table.up td{padding:7px 8px;text-align:center;white-space:nowrap}
table.up th{color:var(--fg3);font-weight:500;font-size:11px;line-height:1.3}
table.up th:first-child,table.up td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:500;color:var(--fg)}
table.up td{color:var(--fg3)}
table.up td.v2{color:var(--fg2)}
table.up td.v3{color:var(--blue-ink);font-weight:700;background:var(--blue-soft);border-radius:6px}
table.up td.v4{color:#fff;font-weight:700;background:var(--blue);border-radius:6px}
.log{display:flex;gap:12px;padding:12px 20px;align-items:center;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.log .ic{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--fg2)}
.log .ic.ok{background:var(--blue-soft);color:var(--blue-ink)}
.log .body{flex:1;min-width:0}
.log .t{font-size:15px;font-weight:500}
.log .s{font-size:12px;color:var(--fg3)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:12px;border-radius:14px;background:var(--soft);font-size:13px;color:var(--fg2)}
.note-bar{font-size:13px;color:var(--amber-ink);background:var(--amber-soft);padding:10px 14px;border-radius:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--fg3);font-weight:500;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--fg)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:30;
  background:var(--fg);color:var(--card);border-radius:14px;padding:12px 8px 12px 16px;display:flex;align-items:center;gap:12px;font-size:14px;transition:all .2s;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--blue);font-weight:700;padding:4px 10px;font-size:14px}
:root[data-theme="dark"] .toast button{color:#1B64DA}
.seg.wide{width:100%}
.seg.wide button{flex:1;height:38px;font-size:14px}
.ck.part{border-color:var(--blue);color:var(--blue-ink);font-size:9px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.putdone{color:var(--blue-ink);font-weight:500}
.pill.off{background:transparent;color:var(--fg3);box-shadow:inset 0 0 0 1px var(--line);opacity:.75}
.pill.bad{background:transparent;color:var(--fg3);box-shadow:inset 0 0 0 1px var(--line)}
.linkbtn{color:var(--blue-ink);font-weight:500;text-decoration:underline;text-underline-offset:2px;font-size:13px}
.sublbl{font-size:12px;color:var(--fg3);font-weight:500;margin:14px 0 8px}
.chip.sm{height:32px;font-size:13px}
.acc{border-top:1px solid var(--line)}
.acc:first-child{border-top:0}
.acc-h{display:flex;align-items:center;gap:12px;width:100%;padding:12px 20px;min-height:58px;text-align:left}
.acc-h:hover{background:var(--press)}
.acc-av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.acc-n{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-c{font-size:13px;color:var(--fg3);font-variant-numeric:tabular-nums}
.acc.open .chev{transform:rotate(90deg)}
.acc-b{padding:0 0 8px}
.coord.sub{padding:10px 20px 10px 66px;border-top:0}
.coord.sub .who{gap:6px;font-weight:500}
@media (max-width:420px){.coord.sub{padding-left:20px}}
.tag.sp{background:color-mix(in srgb,#8B5CF6 16%,transparent);color:#7C3AED;font-weight:700}
:root[data-theme="dark"] .tag.sp{color:#C4B5FD}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.sp{color:#C4B5FD}}
.fdot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:9px;font-weight:800;color:var(--blue-ink)}
.fdot svg{width:12px;height:12px}
.fdot.on{background:var(--blue);border-color:var(--blue)}
.fdot.part{border-color:var(--blue)}
.frow2{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:15px}
.frow2.done span:last-child{color:var(--fg3)}
.tag.fcmulti{background:color-mix(in srgb,var(--amber-ink) 24%,var(--card));color:var(--amber-ink);font-weight:700}
.fcnum{flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--amber-soft);color:var(--amber-ink);font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.scline{font-size:14px;color:var(--fg2);margin-top:6px}
.scline b{color:var(--blue-ink);font-weight:700}
.scline span{color:var(--fg3);font-size:12px}
.fcrow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.numpad{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:8px;padding:10px;border-radius:14px;background:var(--soft)}
.numpad button{height:36px;border-radius:10px;background:var(--card);color:var(--fg2);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.numpad button.on{background:color-mix(in srgb,var(--amber-ink) 24%,var(--card));color:var(--amber-ink);box-shadow:inset 0 0 0 1.5px var(--amber-ink)}
.frowgap{margin-top:36px;padding-top:26px;border-top:1px dashed var(--line)}
.fhead.rowhead{margin-bottom:34px}
.ctools{margin-top:36px!important;padding-top:26px;border-top:1px dashed var(--line);gap:16px!important}
.fhead.rowhead .sublbl{font-size:16px;font-weight:700;color:var(--fg)}
.cfoldchips{gap:10px}
.cfxbox{margin:14px 0 6px;padding:16px;border-radius:16px;background:var(--soft);display:flex;flex-direction:column;gap:12px}
.cfxbox h4{margin:0;font-size:13px;color:var(--fg2)}
.upfold{display:block;width:calc(100% - 40px);margin:0 20px 18px;height:44px;border-radius:14px;background:var(--soft);color:var(--fg2);font-size:14px;font-weight:600}
.row.nostore{opacity:.55}
.row.nostore .n{color:var(--fg3)}
.tag.nostore{background:var(--soft);color:var(--fg3)}
.acc-hw{display:flex;align-items:center}
.acc-ck{flex:none;padding:0 0 0 20px;height:58px;display:grid;place-items:center}
.acc-hw .acc-h{padding-left:12px}
.acc.cdone .acc-n,.acc.cdone .acc-c{color:var(--fg3)}
.acc.cdone .acc-av{background:var(--soft);color:var(--fg3)}
.cyline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cyname{width:96px;flex:none;font-size:14px;font-weight:500}
.cyseg{flex:1;min-width:220px}
.cyseg button{flex:1;height:34px;padding:0 6px}
.cyseg button.on{background:var(--blue);color:#fff;font-weight:700;box-shadow:none}
.cyrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.upg{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.upv{flex:none;min-width:38px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.upv.v4{background:var(--blue);color:#fff}
.upv.v3{background:var(--blue-soft);color:var(--blue-ink)}
.upv.v2{background:var(--soft);color:var(--fg2)}
.altline{margin-top:8px;font-size:13px;color:var(--amber-ink);background:var(--amber-soft);padding:8px 12px;border-radius:12px;line-height:1.6}
.altdone{color:var(--fg3)}
.fcard.full{opacity:.7}
.fhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chip.fold{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--fg2)}

}

/* ---------- 2026-10-28 에디터 시스템 + 장르 색 + 넓은 화면 ---------- */
.ed{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.ed.soft{background:var(--soft);box-shadow:none}
.ed.soft .field,.ed.soft .search{background:var(--card)}
.ed.soft .opt{background:var(--card)}
.edstack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.ed-h{display:flex;align-items:center;gap:8px;min-height:24px}
.ed-h b{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.ed-h span:not(.ed-ic){font-size:12px;color:var(--fg3);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-ic{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-ink)}
.ed-ic svg{width:13px;height:13px}
.ed-sec{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:var(--soft)}
.ed.soft .ed-sec{background:var(--card)}
.ed-act{display:flex;gap:8px;justify-content:flex-end}
.ed-act .btn{min-width:112px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl{font-size:11.5px;font-weight:600;color:var(--fg3);letter-spacing:.01em}
.fld-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.inl{display:flex;gap:8px;align-items:center}
.inl .field{flex:1;min-width:0}
.inl .btn{flex:none}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;background:var(--soft);color:var(--fg2);font-size:13.5px;font-weight:500;box-shadow:inset 0 0 0 1px transparent;transition:background .12s,box-shadow .12s}
.opt i{width:8px;height:8px;border-radius:50%;opacity:.55}
.opt.on{background:var(--blue-soft);color:var(--blue-ink);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--blue)}
.opt.on i{opacity:1}
.opt.num{min-width:40px;justify-content:center;padding:0 10px;font-size:15px}
.sugs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--fg3)}
.sug{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;background:var(--amber-soft);color:var(--amber-ink);font-size:12px;font-weight:600}
.sug svg{width:12px;height:12px}
.detail .ed{background:var(--card)}
.detail{gap:10px}
.kv{margin-bottom:4px}

/* 의류 필터: ⋯ 메뉴 */
.fh-act{display:flex;gap:6px;align-items:center;flex:none;flex-wrap:nowrap}
.chip.mbtn svg{width:16px;height:16px}
.chip.mbtn{width:34px;padding:0;justify-content:center;font-size:16px;letter-spacing:.05em;background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--fg3)}
.chip.mbtn.on{background:var(--soft);color:var(--fg)}
.slotmenu{display:flex;gap:6px;flex-wrap:wrap;margin:-8px 0 14px;padding:10px 12px;border-radius:12px;background:var(--soft)}
.slotmenu .ghostchip{background:var(--card);box-shadow:none;color:var(--fg2)}
.savedot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-left:6px;vertical-align:middle}

/* 장르 태그 */
.tag.cat{--c:#6B7280;background:color-mix(in srgb,var(--c) 13%,var(--card));color:var(--c);font-weight:700}
:root[data-theme="dark"] .tag.cat{color:color-mix(in srgb,var(--c) 42%,#fff);background:color-mix(in srgb,var(--c) 30%,var(--card))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.cat{color:color-mix(in srgb,var(--c) 42%,#fff);background:color-mix(in srgb,var(--c) 30%,var(--card))}}
.row .t{row-gap:4px}
.lgic{background:var(--blue-soft);color:var(--blue-ink)}
.legend{align-items:center}

/* 넓은 화면(아이패드 가로·데스크톱): 탭바를 왼쪽 레일로 */
@media (min-width:900px){
  body{padding-left:calc(96px + max(16px,env(safe-area-inset-left,0px)));padding-bottom:40px}
  .app{max-width:720px;padding-top:28px}
  nav.tabs{top:0;bottom:0;right:auto;width:96px;border-top:0;border-right:1px solid var(--line);padding:24px 10px}
  nav.tabs .in{grid-template-columns:1fr;grid-auto-rows:min-content;gap:6px}
  nav.tabs button{padding:8px 0 6px;font-size:11px;border-radius:14px}
  nav.tabs button.on{background:var(--blue-soft)}
  nav.tabs button.on .tic{background:transparent}
  .toast{bottom:28px;left:calc(50% + 48px)}
  .tiles{grid-template-columns:repeat(4,1fr)}
}

/* 컴팩트 수정 줄 */
.edl{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
.edl-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.edl .fl{flex:none}
.opts.mini{gap:4px}
.opts.mini .opt{height:28px;padding:0 10px;font-size:12.5px;border-radius:8px;gap:5px}
.opts.mini .opt.num{min-width:32px;padding:0 8px;font-size:13.5px}
.edl .inl .field,.edl .inl .btn{height:36px;font-size:13.5px}
.edl .inl .btn{padding:0 14px;border-radius:10px}
.edl .field.kind{flex:none;width:auto;padding-right:30px;background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px}
.edl .inl{flex-wrap:wrap}
.edl .inl .field:not(.kind){flex:1 1 120px}
.edl .hint{font-size:11.5px}
.cfxbox{margin:6px 20px 10px 62px;padding:10px 0 0;background:transparent;box-shadow:none;border-radius:0}
@media (max-width:420px){.cfxbox{margin-left:20px}}
.detail{gap:12px}

/* 태그 체계 */
.tag.sem{--c:#6B7280;background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent);color:var(--c);font-weight:600}
:root[data-theme="dark"] .tag.sem{color:color-mix(in srgb,var(--c) 65%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.sem{color:color-mix(in srgb,var(--c) 65%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent)}}
.pill.fixed{box-shadow:inset 0 0 0 1px color-mix(in srgb,#0891B2 55%,transparent);color:#0891B2}
.opt.wrong.on{background:color-mix(in srgb,#E11D48 12%,var(--card));color:#E11D48;box-shadow:inset 0 0 0 1.5px #E11D48}
/* 접힘 카드 컴팩트 + 글자 크기 정리 */
.fold-h{padding:12px 16px;gap:10px}
.fold-ic{width:34px;height:34px;border-radius:10px}
.fold-ic svg{width:18px;height:18px}
.fold-t b{font-size:14.5px;font-weight:600}
.fold-t span{font-size:12px}
.fold-b{padding:0 16px 16px}
.fold-b .rrow{padding:8px 16px}
.fold-b .rlist{margin:0 -16px!important}
.rcic{background:var(--green-soft);color:var(--green)}
.upblk{padding:10px 0 2px}
.upblk + .upblk{border-top:1px dashed var(--line)}
.upname{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.upname b{font-size:14px;font-weight:700}
.upname span{font-size:12px;color:var(--fg3)}
.sec-h h2,.fhead.rowhead .sublbl{font-size:16px}
.hello h1{font-size:24px}
.tile .tv{font-size:24px}
.hdr-r{display:flex;align-items:center;gap:10px;flex:none}
.hdr-r .btn.sm{height:32px;padding:0 12px;font-size:12.5px;background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.need-card .pills .pill{font-size:12.5px}
.edl .inl .fl{flex:none}
.edl .inl .field[inputmode=numeric]{flex:1 1 80px}

/* ---------- 2026-10-28 테마: 모드(시스템/라이트/다크) + 색 팔레트 선택 ---------- */
.prefs{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:2px 4px 0}

/* ---------- 2026-10-28 하이브리드 디자인: 카드 대신 여백·구분선, 폼은 시트. html[data-design="hybrid"]일 때만 ---------- */

/* 칩: 경계선 */
:root[data-design="hybrid"] .chip{height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg2);font-size:12.5px;font-weight:500}
:root[data-design="hybrid"] .chip.on{background:var(--blue-soft);color:var(--blue-ink);border-color:color-mix(in srgb,var(--blue) 45%,transparent);box-shadow:none;font-weight:600}

.bttry{flex:none;height:28px;font-size:12px}
.bttries{display:flex;flex-direction:column;border-top:1px dashed var(--line);margin-top:2px}
.bttry-row{display:flex;align-items:baseline;gap:10px;padding:6px 0;font-size:12.5px;color:var(--fg3);border-bottom:1px solid var(--line)}
.bttry-row:last-child{border-bottom:0}
.bttry-row .k{flex:none;width:56px}
.bttry-row b{color:var(--fg2);font-variant-numeric:tabular-nums}
.bttry-row i{font-style:normal;font-size:11px;font-weight:600;margin-left:3px}
.bttry-row i.ok{color:var(--green)}.bttry-row i.ng{color:var(--red)}
.bttry-row .d{flex:none;font-size:11.5px}

.bttry-row{border-bottom:0}
.bttry-wear{display:flex;flex-direction:column;gap:2px;padding:0 0 8px 66px;border-bottom:1px solid var(--line);font-size:12px;color:var(--fg3)}
.bttry-wear:last-child{border-bottom:0}
.bttry-wear > div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.bttry-wear .k{flex:none;width:52px}
.bttry-wear .n{flex:1;min-width:0;color:var(--fg2)}
.bttry-wear b{color:var(--fg2);font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:420px){.bttry-wear{padding-left:0}}

/* 전투 이전 회차 구분선 */
.btprev{display:flex;align-items:center;gap:8px;margin:10px 0 2px;font-size:11.5px;font-weight:600;color:var(--fg3)}
.btprev::before,.btprev::after{content:"";flex:1;height:1px;background:var(--line)}
/* 코디: 이름 칩 */
.cochips .chip{gap:4px}
.cochips .chip svg{width:12px;height:12px}
.cochips .chip.done:not(.on){opacity:.42}
.cocard{margin:14px 0 0}
.cocard.cdone .fc-n{color:var(--fg3);text-decoration:line-through}
.cocard .coord.sub{padding:8px 0 0}
.cocard .fc-h .iconbtn:last-child{margin-left:2px}
/* 의류 조건별 색: 장르(메인) · 옷본(자두) · 재료(세이지) · 옵션(모래) · 전투(슬레이트) */
:root{--r-cat:var(--blue);--r-pat:#8C6FA6;--r-mat:#5F8C82;--r-opt:#A88450;--r-bt:#6B7EA6}
.rdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.rdot.r-cat{background:var(--r-cat)}.rdot.r-pat{background:var(--r-pat)}.rdot.r-mat{background:var(--r-mat)}.rdot.r-opt{background:var(--r-opt)}.rdot.r-bt{background:var(--r-bt)}
.chip.on[data-ccat]{--rc:var(--r-cat)}.chip.on[data-cpat]{--rc:var(--r-pat)}.chip.on[data-cmat]{--rc:var(--r-mat)}.chip.on[data-copt]{--rc:var(--r-opt)}.chip.on[data-cbt]{--rc:var(--r-bt)}
.chip.on[data-ccat],.chip.on[data-cpat],.chip.on[data-cmat],.chip.on[data-copt],.chip.on[data-cbt],
:root[data-design="hybrid"] .chip.on[data-ccat],:root[data-design="hybrid"] .chip.on[data-cpat],:root[data-design="hybrid"] .chip.on[data-cmat],:root[data-design="hybrid"] .chip.on[data-copt],:root[data-design="hybrid"] .chip.on[data-cbt]{background:color-mix(in srgb,var(--rc) 16%,var(--card));color:color-mix(in srgb,var(--rc) 72%,var(--fg));border-color:color-mix(in srgb,var(--rc) 50%,transparent)}
.chip.on[data-ccat] b,.chip.on[data-cpat] b,.chip.on[data-cmat] b,.chip.on[data-copt] b,.chip.on[data-cbt] b{color:inherit;opacity:.75}
.chip.spchip.on[data-copt],:root[data-design="hybrid"] .chip.spchip.on[data-copt]{background:color-mix(in srgb,var(--rc) 26%,var(--card))}

/* 회차 연계 */
.cpt small{font-size:15px;font-weight:600;margin-left:3px;color:var(--fg3)}
.ihlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ihbuy{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ihl{display:flex;flex-direction:column;min-width:0}
.ihl b{font-size:14px;font-weight:600}
.ihl span{font-size:11.5px;color:var(--fg3)}
.ihbuy:not(.on) .ihl b{color:var(--fg2)}
.ihseg{flex:none}
.ihseg button{min-width:44px;padding:0 8px;font-size:12.5px}
.ihrow{grid-template-columns:minmax(0,1fr) 116px 72px}
.ihv.off{color:var(--fg3);font-weight:500;font-size:12px}

/* 콘테스트 출현 점수 */
.cyhead{display:flex;justify-content:space-between;font-size:11.5px;color:var(--fg3);margin:4px 0 -2px}
.cyl3{display:grid;grid-template-columns:96px minmax(0,1fr) 96px;gap:10px;align-items:center}
.cyl3 .cyseg{min-width:0}
.cysin{height:34px;text-align:right;font-variant-numeric:tabular-nums;padding:0 10px}
@media (max-width:560px){
  .cyl3{grid-template-columns:minmax(0,1fr) 104px;row-gap:6px}
  .cyl3 .cyname{grid-column:1;grid-row:1;width:auto}
  .cyl3 .cysin{grid-column:2;grid-row:1}
  .cyl3 .cyseg{grid-column:1 / -1;grid-row:2}
}
.cyl2{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center}
.cyl2 .cyname{width:auto}
.cyedit{margin:2px 0 10px}
.cysc{font-variant-numeric:tabular-nums;color:var(--blue-ink);font-weight:700}
.cyask{margin-top:14px;padding:14px;border-radius:12px;background:var(--blue-soft);border:1px solid color-mix(in srgb,var(--blue) 30%,transparent)}
.cyask-h{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--blue-ink)}
.cyask-h svg{width:16px;height:16px}
.cyask-it{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px;margin-top:6px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13.5px;line-height:1.5;color:var(--fg)}
.cyask-it.on{border-color:var(--blue)}
.cyask-it .ck{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;margin-top:1px}
.cyask-it.on .ck{background:var(--blue);border-color:var(--blue);color:#fff}
.cyask-it .ck svg{width:13px;height:13px}

/* 기록 줄 아이콘 크기 */
.cyrow .iconbtn{width:30px;height:30px}
.cyrow .iconbtn svg{width:16px;height:16px}
/* 수정 팝업: 항상 가운데 모달, 열릴 때만 애니메이션, 뒤 화면 스크롤 잠금 */
html.sheet-open,html.sheet-open body{overflow:hidden;overscroll-behavior:none}
.scrim{animation:none}
.scrim.enter{animation:scrimIn .16s}
.sheet{animation:none}
.scrim.enter .sheet{animation:modalIn .18s cubic-bezier(.2,.8,.2,1)}
@keyframes modalIn{from{transform:translateY(8px) scale(.98);opacity:0}}
.scrim.modal{align-items:center;padding:16px;overflow-y:auto;overscroll-behavior:contain}
.scrim.modal .sheet{width:100%;max-width:600px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
@media (max-width:560px){.scrim.modal .sheet{padding:16px 18px 18px;border-radius:14px}}
@media (prefers-reduced-motion:reduce){.scrim.enter,.scrim.enter .sheet{animation:none}}

/* 기억할 것 */
.memo{display:flex;flex-direction:column}
.mrow{padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0;padding-top:2px}
.mh{display:flex;align-items:baseline;gap:8px}
.mh b{font-size:14.5px;font-weight:600}
.mh span{font-size:11.5px;color:var(--fg3)}
.mv{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.mchip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue-ink);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.mgrid .chip{justify-content:center;padding:0}
.sec-h .chip svg{width:13px;height:13px;margin-right:4px}

/* 위쪽 빠른 보기: 리셋 주기 / 개량 옵션 찾기 */
.prefs .qseg button.on,:root[data-design="hybrid"] .prefs .qseg button.on{background:var(--blue);color:#fff;box-shadow:none}
#quick[hidden]{display:none}
.qpanel{margin:0 0 12px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);animation:scrimIn .15s}
.qpanel .memo .mrow:first-child{padding-top:0}
.qpanel .qup .chips{margin-top:8px!important}
@media (prefers-reduced-motion:reduce){.qpanel{animation:none}}

/* 회차 연계: 점원 3능력 표 */
.ihst{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ihst-h,.ihst-r{display:grid;grid-template-columns:minmax(58px,1fr) repeat(3,minmax(0,86px));gap:6px;align-items:start}
.ihst-h{padding:6px 0 4px;font-size:11.5px;color:var(--fg3);text-align:center}
.ihst-r{padding:7px 0;border-bottom:1px solid var(--line)}
.ihst-n{display:flex;flex-direction:column;min-width:0;padding-top:6px}
.ihst-n b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ihst-n span{font-size:11px;color:var(--fg3)}
.ihst-c{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0}
.ihst-c .field{height:34px;padding:0 8px;text-align:right;font-variant-numeric:tabular-nums}
.ihst-c i{font-style:normal;font-size:11.5px;text-align:right;color:var(--blue-ink);font-weight:600;font-variant-numeric:tabular-nums;min-height:14px}

/* 메인 접는 카드(클리어 포인트·회차 연계) 안쪽을 다른 메인 카드와 같은 크기로 */
.fold-b .cpt{font-size:24px}
.fold-b .cpt small{font-size:13px}
.fold-b .cptot{margin:0 0 10px}
.fold-b .cprow{padding:6px 0}
.fold-b .cprow label b{font-size:13.5px}
.fold-b .cprow .field{height:34px;font-size:14px}
.fold-b .cpv{font-size:14px}
.fold-b .ihbuy{padding-block:6px}
.fold-b .ihbuy .ihl b{font-size:13.5px}

/* 콘테스트 수정 창: 이전 기록 아코디언 */
.chist{margin-top:2px}
.chist-list{display:flex;flex-direction:column;margin-top:8px;border-top:1px solid var(--line)}
.chist-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.chist-row b{font-variant-numeric:tabular-nums}
.chist-row .hint{font-size:12px}

/* ---------- 입력창·버튼 크기 통일(작게) ---------- */
html body .field{height:36px!important;font-size:14px!important;border-radius:9px!important;padding:0 11px!important}
html body select.field{padding-right:28px!important;background-image:linear-gradient(45deg,transparent 50%,var(--fg3) 50%),linear-gradient(135deg,var(--fg3) 50%,transparent 50%)!important;background-size:5px 5px!important;background-repeat:no-repeat!important;background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%!important;appearance:none;-webkit-appearance:none}
html body .field.sm,html body .cysin{height:32px!important}
html body .btn{height:38px!important;font-size:13.5px!important}
html body .btn.sm{height:32px!important;font-size:13px!important}
html body .opt{height:32px}
html body .cyseg button{height:30px}
@media (max-width:420px){html body .cyl3{grid-template-columns:minmax(0,1fr) 92px}}
html body .cyl2{grid-template-columns:minmax(0,1fr) 100px}
/* 휴대폰·패드(터치): 글자가 16px보다 작으면 누를 때 화면이 확대돼서 16px 유지 */
@media (pointer:coarse){html body .field,html body input,html body select,html body textarea{font-size:16px!important}}

/* 콘테스트 통과 기준: 칸을 누르면 그 자리에서 펼침 */
.cform{margin:0 0 12px;padding:12px 14px;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;gap:8px}
.cform-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cform-row .field{flex:1 1 120px;min-width:0;background:var(--card)}
.cform-row .opts{flex:none;flex-wrap:nowrap}
.cform-row .btn{flex:none;min-width:0;padding:0 16px}
.chist-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--fg3);font-weight:600}
.chist-act{display:flex;gap:10px}
.linkbtn{font-size:12.5px;color:var(--fg3);text-decoration:underline;text-underline-offset:2px}
.linkbtn.danger{color:var(--red)}
.cform .chist-list{margin-top:4px}

/* 코디 요청마다 수정 아이콘(줄 오른쪽 끝) */
.coord.sub .who{position:relative;padding-right:36px}
.coord.sub .coedit{position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:32px;height:32px;color:var(--fg3)}
.coord.sub .coedit svg{width:16px;height:16px}

/* 의류: 게임에서 확인할 것 */
.warnbtn{display:inline-flex;align-items:center;gap:3px;width:auto;padding:0 8px;height:32px;border-radius:9px;color:var(--fg3);margin-right:8px}
.warnbtn svg{width:17px;height:17px}
.warnbtn b{font-size:12px;font-weight:700}
.warnbtn.has{color:var(--amber-ink);background:var(--amber-soft)}
.warnbtn.on{box-shadow:inset 0 0 0 1.5px var(--amber-ink)}
.vbox{margin:10px 0 4px;padding:12px 14px;border-radius:12px;background:var(--amber-soft)}
.vbox-h{display:flex;align-items:center;gap:6px;color:var(--amber-ink);margin-bottom:6px}
.vbox-h svg{width:16px;height:16px}
.vbox-h b{font-size:14px;flex:1}
.vrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.vrow .ck{flex:none;margin-top:1px;cursor:pointer}
.vrow.done .vt{text-decoration:line-through;color:var(--fg3)}
.vrow.done .pills{opacity:.5}
.vt{font-size:13.5px;font-weight:600}
.vbody{flex:1;min-width:0}
.vbody .pills{margin-top:5px}
.vchip{cursor:pointer;gap:6px}
.vchip .hint{font-size:11.5px}
.vrow .ck{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--fg3);background:var(--card)}
.vrow .ck.on{background:var(--amber-ink);border-color:var(--amber-ink);color:#fff}
.vrow .ck.on svg{opacity:1;transform:none;width:13px;height:13px}
.vchip .hint{margin-left:6px}

/* 이전 회차 기록 접기 버튼: 작게, 가운데 */
.prevfold{display:flex;justify-content:center;margin:10px 0 2px}
.prevbtn{font-size:12.5px;color:var(--fg3);padding:4px 10px;border-radius:8px}
.prevbtn:hover,.prevbtn[aria-expanded="true"]{color:var(--fg2);background:var(--soft)}

/* 의류 보기: 추가옵션·전투 추천은 겹쳐 고르는 테두리 버튼 */
.closeg .kindtab{border:1.5px solid var(--line)!important;border-radius:999px!important;padding:0 11px!important;margin:0 3px;height:30px;align-self:center;box-shadow:none!important}
.closeg .kindtab.on{background:var(--blue-soft)!important;border-color:var(--blue)!important;color:var(--blue-ink)!important;font-weight:700}
.closeg .kindtab::after{display:none!important}

/* 의류 보기: 위쪽 기기 선택과 같은 알약 모양. 여러 개 켤 수 있음 */
.cloview{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none}
.pillseg{display:inline-flex;align-items:center;gap:2px;background:var(--soft);padding:3px;border-radius:9px}
.pillseg button{height:30px;padding:0 12px;border-radius:7px;font-size:13px;color:var(--fg2);line-height:30px;margin:0;border:0;background:none;white-space:nowrap}
.pillseg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ctools{align-items:center!important}
.ctools .search{flex:1 1 220px;min-width:0}

/* 시설 40P 태그 */
.tag.p40{background:var(--amber-soft);color:var(--amber-ink);font-weight:700}
/* 전체 옷 필요한 옵션 세기 */
.optcnt{margin-top:14px}
.optcnt .pill{cursor:pointer;user-select:none;-webkit-user-select:none}
.optcnt .pill b{min-width:14px;text-align:center}

/* 칩 순서 수정 */
.orderbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-10px 0 14px;padding:8px 12px;border-radius:10px;background:var(--blue-soft);color:var(--blue-ink);font-size:12.5px;flex-wrap:wrap}
.dragwrap .dragchip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border:1.5px dashed var(--line);gap:6px}
.dragchip i{font-style:normal;font-size:10px;letter-spacing:-2px;color:var(--fg3)}
.dragchip.dragging{opacity:.55;border-color:var(--blue);cursor:grabbing}

/* 체크칸: 하이브리드 디자인에서 완료(on) 색이 안 보이던 문제 */
:root[data-design="hybrid"] .ck.on{background:var(--blue);border-color:var(--blue)}
:root[data-design="hybrid"] .ck.on svg{opacity:1;transform:none}

/* 배치 연습 */
.laygs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.laygbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:9px;background:var(--soft);font-size:13px;color:var(--fg2);border:1.5px solid transparent}
.laygbtn i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.laygbtn b{font-size:11.5px;color:var(--fg3);font-weight:600}
.laygbtn.on{background:var(--card);border-color:var(--c);color:var(--fg);font-weight:700}
.layinfo{font-size:13px;color:var(--fg2);min-height:20px;margin-bottom:8px}
.laywrap{max-width:560px;margin:0 auto}
.laysvg{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--card);border-radius:8px;cursor:crosshair}
.lay-l{stroke:var(--line);stroke-width:0.04;fill:none}
.lay-road{fill:var(--soft)}
.lay-t{font-size:0.75px;font-weight:700;fill:var(--fg);pointer-events:none}
.lay-t.big{font-size:1.1px}
.lay-r{cursor:pointer}
.layact{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:10px}
.chip.danger{color:var(--red);border-color:var(--red)}
.laylist{margin-top:12px;border-top:1px solid var(--line)}
.layrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:13.5px}
.laydot{width:10px;height:10px;border-radius:3px;flex:none}
.laysz{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.laysz .pill{cursor:pointer}
.layrec{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.layrec-l{font-size:13px;color:var(--fg2);margin-right:2px}
.laynum{width:32px;height:32px;border-radius:9px;background:var(--soft);font-size:14px;font-weight:600;color:var(--fg2)}
.laynum.on{background:var(--accent,var(--fg));color:var(--card)}
.layrecbox{background:var(--soft);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
.laynum.has{box-shadow:inset 0 0 0 1.5px var(--fg3)}
.laynum.has.on{box-shadow:none}
.laysbox{display:flex;gap:12px;align-items:center}
.laymini{width:64px;height:64px;flex:none;background:var(--card);border-radius:6px;border:1px solid var(--line)}
.laymini.empty{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--fg3)}
.lay-h{fill:var(--card);stroke-width:0.18;cursor:nwse-resize}
.layedit{background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.layedit-r{display:flex;align-items:center;gap:6px;font-size:13.5px}
.layedit-r b{min-width:22px;text-align:center}
.layedit-l{font-size:13px;color:var(--fg2);min-width:30px}
